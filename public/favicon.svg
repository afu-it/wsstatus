  <rect width="512" height="512" rx="128" fill="white"/>
  
  <!-- Status Ring (Instagram/WhatsApp style) -->
  <circle cx="256" cy="256" r="160" stroke="#25D366" stroke-width="24" fill="none" stroke-linecap="round" stroke-dasharray="900 1005" transform="rotate(-90 256 256)"/>
  
  <!-- Inner Circle Background -->
  <circle cx="256" cy="256" r="128" fill="#25D366"/>
  
  <!-- WS Text - Clean and Modern -->
  <text x="256" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="700" fill="white" text-anchor="middle">WS</text>
